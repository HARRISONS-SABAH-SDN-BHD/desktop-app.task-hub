[package]
name = "task-hub"
version = "0.7.5"
description = "A local, data-driven workflow desktop application"
authors = ["Task Hub contributors"]
edition = "2021"

[lib]
name = "task_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "task-hub"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-notification", "dep:tauri-plugin-updater"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.33", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
iana-time-zone = "0.1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
csv = "1"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "native-tls"] }
sha2 = "0.10"
regex = "1"
url = "2"
tempfile = "3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25.1"
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com"] }

[dev-dependencies]
roxmltree = "0.20"
